[project]
name = "mdp-commander"
version = "0.1.0"
description = "Control the Miniware MDP-P906 through an Arduino/nRF24L01 adapter"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
]

[project.scripts]
mdp = "mdp_commander.cli:main"

[project.urls]
Repository = "https://github.com/leommxj/mdp_commander"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
]
